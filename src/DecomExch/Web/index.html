<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DecomExch</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6ff5'/%3E%3Ctext x='16' y='21' font-family='Segoe UI,Arial' font-size='14' font-weight='700' fill='white' text-anchor='middle'%3EDX%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="live-banner" role="status">LIVE-modus: acties worden echt uitgevoerd op de Exchange-omgeving</div>

  <div class="app hidden" id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">DX</div>
        <div>
          <div class="brand-name">DecomExch</div>
          <div class="brand-sub">Exchange opruimen &amp; uitfaseren</div>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="Hoofdnavigatie"></nav>
      <div class="sidebar-foot">
        <div id="foot-user"></div>
        <button type="button" id="btn-theme" title="Wissel tussen licht en donker thema"></button>
        <button type="button" id="btn-shutdown" title="Stop de webserver in PowerShell"></button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 id="page-title">Dashboard</h1>
        <div class="spacer"></div>
        <button type="button" class="pill" id="conn-pill" title="Exchange-verbinding">
          <span class="dot" id="conn-dot"></span><span id="conn-text">Controleren...</span>
        </button>
        <label class="mode" title="In simulatiemodus wordt niets gewijzigd of geexporteerd (-WhatIf)">
          <span class="label-sim">Simulatie</span>
          <span class="label-live">LIVE</span>
          <span class="switch"><input type="checkbox" id="live-toggle" aria-label="Live-modus"><span></span></span>
        </label>
      </header>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>

  <div class="splash hidden" id="splash"></div>

  <dialog id="dialog"></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
