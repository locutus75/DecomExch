name: tests

on:
  push:
  pull_request:

jobs:
  pester:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell   # Windows PowerShell 5.1, zoals de Exchange Management Shell
          - os: windows-latest
            shell: pwsh
          - os: ubuntu-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Pester installeren
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Tests uitvoeren
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
